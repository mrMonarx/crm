# Backend load balancing pool.
# 'backend' — Docker Compose service nomi. Scale qilinganda
# (docker compose up --scale backend=3) Docker DNS bu nomni
# bir nechta konteyner IP'siga aylantiradi va Nginx ularni
# round-robin bilan TAQSIMLAYDI.
upstream backend_pool {
    server backend:5000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss;

    # API proxy — route /api/* to backend (LOAD BALANCED)
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        # Qaysi backend konteyneri javob berganini ko'rsatadi
        # (DevTools → Network → Response Headers — load balancing isboti)
        add_header X-Upstream-Addr $upstream_addr always;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
