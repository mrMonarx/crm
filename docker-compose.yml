version: '3.9'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securepassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_network

  # ============================================================
  # Backend API (Node.js + Express)
  # Scale qilish uchun: docker compose up -d --scale backend=3
  # Frontend Nginx 'backend' nomini Docker DNS orqali topadi va
  # bir nechta nusxa o'rtasida so'rovlarni round-robin TAQSIMLAYDI.
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: crm_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-securepassword123}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      FRONTEND_URL: http://localhost
    # NOTE: 'container_name' va 'ports' OLIB TASHLANDI —
    # ular bir nechta nusxa (scale) ko'tarishga to'sqinlik qiladi.
    # Backend'ga faqat frontend Nginx orqali (/api/) kiriladi.
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - crm_network
    labels:
      - "com.crm.service=backend"
      - "com.crm.version=1.0.0"

  # ============================================================
  # Frontend (React + Nginx)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: crm_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - crm_network
    labels:
      - "com.crm.service=frontend"

# ============================================================
# Volumes & Networks
# ============================================================
volumes:
  postgres_data:
    driver: local

networks:
  crm_network:
    driver: bridge
    name: crm_network
