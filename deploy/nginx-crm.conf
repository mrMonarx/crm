# ============================================================
# NexusCRM — System Nginx (AWS EC2) — Load Balancer + Reverse Proxy
# ============================================================
# Joylashuvi server'da:  /etc/nginx/sites-available/crm
# Faollashtirish:
#   sudo ln -s /etc/nginx/sites-available/crm /etc/nginx/sites-enabled/crm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Bu konfiguratsiya:
#   1) Frontend (React build) ni statik fayl sifatida uzatadi
#   2) /api/ so'rovlarini backend'ga LOAD BALANCING bilan yo'naltiradi
#   3) PM2 cluster nusxalari orasida yukni taqsimlaydi
# ============================================================

# --- Upstream: backend nusxalari (Load Balancing pool) ---
# PM2 cluster mode bitta portda (5000) ishlaydi va o'zi taqsimlaydi.
# Agar bir nechta ALOHIDA portda ishga tushirsangiz (masalan 5000,5001,5002),
# Nginx ham qo'shimcha tarmoq darajasida balancing qiladi.
upstream crm_backend {
    # Yuklamani taqsimlash strategiyasi: eng kam ulanishga yo'naltirish
    least_conn;

    server 127.0.0.1:5000;
    # Qo'shimcha nusxalar (agar PM2 ni alohida portlarda ishga tushirsangiz):
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;

    keepalive 32;
}

server {
    listen 80;
    server_name 51.21.194.172 _;

    root /opt/crm/frontend/dist;
    index index.html;

    # --- Gzip siqish ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    # --- API proxy + Load Balancing ---
    location /api/ {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;

        # Bu header orqali QAYSI backend nusxasi javob berganini ko'rasiz
        # (DevTools → Network → Response Headers'da ko'rinadi — load balancing isboti)
        add_header X-Upstream $upstream_addr always;
    }

    # --- Health check ---
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # --- Statik fayllar (uzoq muddatli kesh) ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- React Router (SPA) ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
