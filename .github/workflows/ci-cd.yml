name: CRM CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # ============================================================
  # 1) Backend test (real PostgreSQL bilan)
  # ============================================================
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crm_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./backend
        run: npm install
      - name: Run tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PASSWORD: testpass
          JWT_SECRET: test_secret_key_for_ci_pipeline_only
        run: npm test --if-present

  # ============================================================
  # 2) Frontend build (Vite)
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  # ============================================================
  # 3) Deploy — AWS EC2'ga SSH orqali, Docker Compose bilan
  # ============================================================
  deploy:
    name: Deploy to EC2 (Docker)
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker compose ps
            echo "Deploy muvaffaqiyatli (Docker)!"
