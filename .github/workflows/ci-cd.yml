name: CRM CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/crm

            # Kodni yangilash
            git pull origin main

            # Backend yangilash
            cd /opt/crm/backend
            npm install
            pm2 restart crm-backend

            # Frontend yangilash
            cd /opt/crm/frontend
            npm install
            npm run build

            # Nginx restart
            sudo systemctl restart nginx

            echo "✅ Deploy muvaffaqiyatli!"